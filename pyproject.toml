[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplefold"
version = "0.1.0"
description = "Folding proteins with SimpleFold."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yuyang Wang", email = "yuyangw@apple.com" },
    { name = "Miguel Angel Bautista Martin", email = "mbautistamartin@apple.com" }
]
dependencies = [
    "torch>=2.6", "fair-esm==2.0.0", "timm==1.0.19", "lightning==2.5.2",
    "hydra-core==1.3.2", "einops==0.8.1", "numpy", "biopython==1.85",
    "rdkit==2025.3.5", "mashumaro==3.16", "ihm==2.7", "modelcif==1.4",
    "dm-tree==0.1.9", "click==8.2.1", "tqdm",
]

[project.optional-dependencies]
reference = ["fairscale==0.4.13", "scipy"]
training = ["fairscale==0.4.13", "scipy", "gemmi==0.7.3", "p-tqdm==1.4.2",
            "hydra-colorlog==1.2.0", "scikit-learn==1.7.1", "pandas==2.3.1", "biotite==1.2.0"]
notebook = ["ipykernel==6.22.0", "py3Dmol==2.5.2", "seaborn==0.13.2", "mediapy==1.0.2", "ipyvtklink==0.2.3"]

[project.urls]
Homepage = "https://github.com/apple/ml-simplefold"

[project.scripts]
simplefold = "simplefold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simplefold*"]

[tool.setuptools.package-data]
"simplefold.configs" = ["**/*.yaml"]